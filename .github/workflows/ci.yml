
name: SportMate CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker tag sportmate-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:latest

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker tag sportmate-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:latest