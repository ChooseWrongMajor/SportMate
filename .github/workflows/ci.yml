name: SportMate CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Create temporary environment variables for CI only.
      # These values are not production credentials.
      - name: Prepare CI environment
        run: |
          cat > backend/.env <<'EOF'
          PORT=5000
          DATABASE_URL=postgresql://sportmate_app:ci_password@db:5432/sportmate
          DATABASE_SSL=false
          JWT_SECRET=ci_only_secret_for_build
          POSTGRES_PASSWORD=ci_password
          EOF

      - name: Validate Docker Compose
        run: docker compose --env-file backend/.env config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose --env-file backend/.env build

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag sportmate-backend:latest \
            "${DOCKERHUB_USERNAME}/sportmate-backend:latest"
          docker tag sportmate-backend:latest \
            "${DOCKERHUB_USERNAME}/sportmate-backend:${IMAGE_TAG}"

          docker push "${DOCKERHUB_USERNAME}/sportmate-backend:latest"
          docker push "${DOCKERHUB_USERNAME}/sportmate-backend:${IMAGE_TAG}"

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag sportmate-frontend:latest \
            "${DOCKERHUB_USERNAME}/sportmate-frontend:latest"
          docker tag sportmate-frontend:latest \
            "${DOCKERHUB_USERNAME}/sportmate-frontend:${IMAGE_TAG}"

          docker push "${DOCKERHUB_USERNAME}/sportmate-frontend:latest"
          docker push "${DOCKERHUB_USERNAME}/sportmate-frontend:${IMAGE_TAG}"