name: SportMate CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sportmate-backend:latest \
            "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:latest"
          docker tag sportmate-backend:latest \
            "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:${IMAGE_TAG}"

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-backend:${IMAGE_TAG}"

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sportmate-frontend:latest \
            "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:latest"
          docker tag sportmate-frontend:latest \
            "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:${IMAGE_TAG}"

          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sportmate-frontend:${IMAGE_TAG}"