
services:
  db:
    image: postgres:18-alpine
    container_name: sm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportmate
      POSTGRES_USER: sportmate_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportmate_app -d sportmate"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    image: sportmate-backend:latest
    container_name: sm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://sportmate_app:${POSTGRES_PASSWORD}@db:5432/sportmate
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: sportmate-frontend:latest
    container_name: sm_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
